name: Build Word Haven Android APK

on:
  push:
    branches: [main]
    paths:
      - "app.js"
      - "index.html"
      - "styles.css"
      - "manifest.webmanifest"
      - "icon.svg"
      - "sw.js"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: npm install

      - name: Prepare bundled game files
        run: |
          mkdir -p www
          cp index.html styles.css app.js manifest.webmanifest icon.svg sw.js www/
          curl --fail --location --retry 3 https://raw.githubusercontent.com/dwyl/english-words/master/words_alpha.txt --output www/words_alpha.txt

      - name: Generate Android project
        run: npx cap add android

      - name: Sync bundled web app
        run: npx cap sync android

      - name: Build installable debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Word-Haven-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: word-haven-android-${{ github.run_number }}
          name: Word Haven Android Build ${{ github.run_number }}
          body: |
            Installable Word Haven Android APK.
            The game files and English word list are bundled inside the APK for offline play.
            This is a debug-signed APK built for direct installation and testing.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
          fail_on_unmatched_files: true